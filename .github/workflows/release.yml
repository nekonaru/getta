name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts
      - name: Build the updater manifest
        run: node .github/scripts/build-latest-json.js artifacts
      - name: Build release notes from the changelog
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          {
            echo "# English"
            awk -v ver="## v${version}" 'index($0, ver) == 1 {found=1; next} found && /^## v/ {exit} found {print}' CHANGELOG.md
            echo ""
            echo "<br>"
            echo ""
            echo "---"
            echo ""
            echo "<br>"
            echo ""
            echo "# Bahasa Indonesia"
            awk -v ver="## v${version}" 'index($0, ver) == 1 {found=1; next} found && /^## v/ {exit} found {print}' CHANGELOG.id.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: Getta ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/bundle-windows-x86_64/nsis/*.exe
            artifacts/bundle-windows-x86_64/nsis/*.exe.sig
            artifacts/bundle-windows-x86_64/msi/*.msi
            artifacts/bundle-darwin-aarch64/dmg/*.dmg
            artifacts/bundle-darwin-aarch64/macos/*.app.tar.gz
            artifacts/bundle-darwin-aarch64/macos/*.app.tar.gz.sig
            artifacts/bundle-darwin-x86_64/dmg/*.dmg
            artifacts/bundle-darwin-x86_64/macos/*.app.tar.gz
            artifacts/bundle-darwin-x86_64/macos/*.app.tar.gz.sig
            artifacts/bundle-linux-x86_64/appimage/*.AppImage
            artifacts/bundle-linux-x86_64/appimage/*.AppImage.sig
            artifacts/bundle-linux-x86_64/deb/*.deb
            artifacts/bundle-linux-x86_64/rpm/*.rpm
            latest.json
