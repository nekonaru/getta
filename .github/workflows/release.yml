name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Build the app
        run: npx tauri build --target ${{ matrix.target }}
      - name: Build release notes from the changelog
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          {
            echo "# English"
            awk -v ver="## v${version}" 'index($0, ver) == 1 {found=1; next} found && /^## v/ {exit} found {print}' CHANGELOG.md
            echo ""
            echo "<br>"
            echo ""
            echo "---"
            echo ""
            echo "<br>"
            echo ""
            echo "# Bahasa Indonesia"
            awk -v ver="## v${version}" 'index($0, ver) == 1 {found=1; next} found && /^## v/ {exit} found {print}' CHANGELOG.id.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Getta ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
