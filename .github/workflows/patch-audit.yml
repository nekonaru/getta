name: Dependency patch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch audited crates
        run: |
          cd src-tauri
          cargo update -p cookie --precise 0.18.3
          cargo update -p url --precise 2.5.9
      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b deps/patch-audit
          git add src-tauri/Cargo.lock
          git commit -m "chore(deps): patch cookie and url advisories"
          git push -f origin deps/patch-audit
          gh pr create --title "chore(deps): patch cookie and url advisories" --body "Automated cargo update for RUSTSEC-2026-0592 and related advisories." --head deps/patch-audit --base main || true
